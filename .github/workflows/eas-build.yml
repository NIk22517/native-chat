name: EAS Development Build (Android)

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 22
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🩺 Run Expo Doctor
        run: npx expo-doctor@latest

      - name: 🔑 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📝 Recreate google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Error: GOOGLE_SERVICES_JSON secret is empty or missing."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_SECRET" > ./google-services.json

      - name: 🏗 Build Android Development Profile
        run: eas build --profile development --platform android --non-interactive
